services:
  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    depends_on:
      - catalogdb

  catalogdb:
    container_name: catalogdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass@word2432
      POSTGRES_DB: catalogdb
    restart: always
    ports:
        - 5432:5432
    volumes:
      - postgres_catalog:/var/lib/postgresql/data